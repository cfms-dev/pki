name: Issue & Deploy CRLs to GitHub Pages

'on':
  push:
    branches:
      - main
    paths:
      - 'crl/**'
      - 'registry/**'
      - 'src/**'
      - 'scripts/**'
      - 'certs/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.python-version'
      - '.github/workflows/crl-pages.yml'
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
          version: '0.13.5'
          python-version: '3.15'

      - name: Install Python
        run: uv python install 3.15

      - name: Install locked dependencies
        run: uv sync --locked --no-dev

      - name: Fetch last successful run timestamp
        id: last_success
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          uv run --locked --no-dev python scripts/fetch_last_success.py

      - name: Export verified ACME revocations
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_D1_DATABASE_ID: ${{ vars.CLOUDFLARE_D1_DATABASE_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_READ_TOKEN }}
        run: uv run --locked --no-dev python -m cfms_pki.acme_export --output "${{ runner.temp }}/revocations.json"

      - name: Issue CRLs
        env:
          PK_GENERIC_INTERMEDIATE: ${{ secrets.PK_GENERIC_INTERMEDIATE }}
          CFMS_PKI_KEY_PASSWORD: ${{ secrets.CFMS_PKI_KEY_PASSWORD }}
          LAST_SUCCESS: ${{ steps.last_success.outputs.timestamp }}
        run: |
          if [ -n "$LAST_SUCCESS" ]; then
            uv run --locked --no-dev cfms-pki issue-crl --fail-on-orphaned --revocations-file "${{ runner.temp }}/revocations.json" --last-success "$LAST_SUCCESS"
          else
            uv run --locked --no-dev cfms-pki issue-crl --fail-on-orphaned --revocations-file "${{ runner.temp }}/revocations.json"
          fi

      - name: Prepare Pages distribution directory
        run: |
          uv run --locked --no-dev cfms-pki build-pages --crl-dir crl --output-dir _site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: '_site'

  deploy:
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
