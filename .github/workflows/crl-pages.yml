name: Issue & Deploy CRLs to GitHub Pages

'on':
  push:
    branches:
      - main
    paths:
      - 'crl/**'
      - 'registry/**'
  schedule:
    # Run twice a week (~3.5 days interval): Sunday 00:00 UTC and Wednesday 12:00 UTC
    - cron: '0 0 * * 0'
    - cron: '0 12 * * 3'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install

      - name: Fetch last successful run timestamp
        id: last_success
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          uv run python scripts/fetch_last_success.py

      - name: Issue CRLs
        env:
          PK_GENERIC_INTERMEDIATE: ${{ secrets.PK_GENERIC_INTERMEDIATE }}
          CFMS_PKI_KEY_PASSWORD: ${{ secrets.CFMS_PKI_KEY_PASSWORD }}
          LAST_SUCCESS: ${{ steps.last_success.outputs.timestamp }}
        run: |
          if [ -n "$LAST_SUCCESS" ]; then
            uv run cfms-pki issue-crl --last-success "$LAST_SUCCESS"
          else
            uv run cfms-pki issue-crl
          fi

      - name: Prepare Pages distribution directory
        run: |
          uv run cfms-pki build-pages --crl-dir crl --output-dir _site

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: '_site'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
