name: Python CI and dependency security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '33 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: '0.13.5'
          python-version: '3.15'
      - run: uv run --locked pytest -q
      - run: uv run --locked ruff check .
        if: runner.os == 'Linux'
      - run: uv run --locked ruff format --check .
        if: runner.os == 'Linux'
      - name: Audit the complete locked Python graph
        shell: bash
        run: |
          uv export --locked --all-groups --no-emit-project --format requirements-txt --output-file "$RUNNER_TEMP/requirements-audit.txt"
          uvx pip-audit --no-deps --disable-pip -r "$RUNNER_TEMP/requirements-audit.txt"

  npm:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workers/acme
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: workers/acme/.node-version
      - run: npm install --global npm@12.2.2
      - run: npm audit --package-lock-only --audit-level=low
