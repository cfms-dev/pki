name: ACME Worker CI

'on':
  push:
    branches:
      - main
    paths:
      - 'workers/acme/**'
      - 'src/cfms_pki/templates/web/**'
      - 'workers/.gitignore'
      - 'registry/**'
      - 'certs/**'
      - '.github/workflows/worker-acme.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'workers/acme/**'
      - 'src/cfms_pki/templates/web/**'
      - 'workers/.gitignore'
      - 'registry/**'
      - 'certs/**'
      - '.github/workflows/worker-acme.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workers/acme

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: workers/acme/.node-version
          cache: 'npm'
          cache-dependency-path: workers/acme/package-lock.json

      - name: Install npm
        run: npm install --global npm@12.2.2

      - name: Install dependencies
        run: npm ci

      - name: Run Typecheck
        run: npm run typecheck

      - name: Check database migration history and schema
        run: npm run db:check

      - name: Apply migrations to a fresh local database
        run: npm run db:migrate:local

      - name: Run Vitest tests
        run: npm test

      - name: Worker runtime smoke test
        run: npm run test:runtime

      - name: Audit dependencies
        run: npm audit --audit-level=low
