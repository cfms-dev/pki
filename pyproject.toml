[project]
name = "cfms-pki"
version = "0.1.0"
description = "PKI infrastructure and automated certificate revocation list management."
readme = "README.md"
authors = [
    { name = "Creeper19472", email = "creeper19472@crpteam.club" }
]
requires-python = ">=3.15"
dependencies = [
    "cryptography>=50.0.2",
    "jinja2>=3.1.6",
]

[project.scripts]
cfms-pki = "cfms_pki.cli:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]
