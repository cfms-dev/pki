<footer>
  <span>{{ acme_footer }}</span>
  <nav aria-label="{{ policies_label }}">
    {% if home_current == "page" %}<span aria-current="page">{{ home_label }}</span>{% else %}<a href="{{ acme_href }}" aria-current="{{ home_current }}">{{ home_label }}</a>{% endif %}
    {% if terms_current == "page" %}<span aria-current="page">{{ terms_label }}</span>{% else %}<a href="{{ terms_href }}" aria-current="{{ terms_current }}">{{ terms_label }}</a>{% endif %}
    {% if privacy_current == "page" %}<span aria-current="page">{{ privacy_label }}</span>{% else %}<a href="{{ privacy_href }}" aria-current="{{ privacy_current }}">{{ privacy_label }}</a>{% endif %}
  </nav>
</footer>
