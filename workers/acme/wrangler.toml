name = "pki"
main = "src/index.ts"
compatibility_date = "2026-11-05"
compatibility_flags = ["nodejs_compat"]

find_additional_modules = true
preserve_file_names = true
base_dir = "cas"

[assets]
directory = "./dist/website"
binding = "ASSETS"
html_handling = "auto-trailing-slash"

[build]
command = "npm run build"

[[rules]]
type = "Text"
globs = ["**/*.pem", "**/*.json"]
fallthrough = true

[[d1_databases]]
binding = "DB"
database_name = "cfms-acme-db"
database_id = "37fed2ac-a473-4d61-9303-ae30991b2d53"

[observability]
enabled = false
head_sampling_rate = 1
redact_query_string = false

[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true
persist = true

[observability.traces]
enabled = true
head_sampling_rate = 1
persist = true

[observability.issues]
enabled = true
