name = "pki"
main = "src/index.ts"
compatibility_date = "2026-08-04"
compatibility_flags = ["nodejs_compat"]

[build]
command = "node scripts/bundle-cas.mjs"

[[rules]]
type = "Text"
globs = ["**/*.pem", "**/*.json"]
fallthrough = true

[[d1_databases]]
binding = "DB"
database_name = "cfms-acme-db"
database_id = "37fed2ac-a473-4d61-9303-ae30991b2d53"

[vars]
CERT_VALIDITY_DAYS = "90"
RENEWAL_WINDOW_DAYS = "30"
CA_DIR = "cas"
