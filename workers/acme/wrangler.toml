name = "pki"
main = "src/index.ts"
compatibility_date = "2026-11-05"

find_additional_modules = true
preserve_file_names = true
base_dir = "cas"

[build]
command = "node scripts/bundle-cas.mjs"

[[rules]]
type = "Text"
globs = ["**/*.pem", "**/*.json"]
fallthrough = true

[[d1_databases]]
binding = "DB"
database_name = "cfms-acme-db"
database_id = "37fed2ac-a473-4d61-9303-ae30991b2d53"

[observability]
enabled = false
head_sampling_rate = 1
redact_query_string = false

[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true
persist = true

[observability.traces]
enabled = true
head_sampling_rate = 1
persist = true

[observability.issues]
enabled = true

[vars]
CERT_VALIDITY_DAYS = "90"
RENEWAL_WINDOW_DAYS = "30"
CA_DIR = "cas"
CAA_ISSUER_DOMAIN_NAME = "cfms-pki.crpteam.club"
WEBSITE_URL = "https://cfms-pki.crpteam.club"
ARI_EXPLANATION_URL = "https://www.rfc-editor.org/rfc/rfc9773.html#section-4.2"
